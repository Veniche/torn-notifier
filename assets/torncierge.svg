<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#22406A"/>
      <stop offset="1" stop-color="#0B1426"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A8"/>
      <stop offset="0.45" stop-color="#F2B33D"/>
      <stop offset="1" stop-color="#B0701A"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5C25A"/>
      <stop offset="1" stop-color="#8E5710"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- soft shadow under the bell -->
  <ellipse cx="512" cy="742" rx="300" ry="24" fill="#000" opacity="0.28"/>
  <!-- knob -->
  <rect x="490" y="316" width="44" height="120" rx="10" fill="url(#base)"/>
  <circle cx="512" cy="306" r="40" fill="url(#gold)"/>
  <!-- dome -->
  <path d="M 286 652 A 226 236 0 0 1 738 652 Z" fill="url(#gold)"/>
  <!-- highlight -->
  <path d="M 366 592 A 164 172 0 0 1 472 462" fill="none" stroke="#FFF6DA" stroke-width="28" stroke-linecap="round" opacity="0.55"/>
  <!-- base plate -->
  <rect x="206" y="648" width="612" height="62" rx="31" fill="url(#base)"/>
  <rect x="236" y="656" width="552" height="12" rx="6" fill="#FFE7A8" opacity="0.45"/>
</svg>
